version: 2
updates:
  # Weekly npm dependency updates (grouped to avoid PR noise)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # @astrojs/check currently supports peerDependency typescript@^5.0.0 || ^6.0.0
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]

  # Weekly GitHub Actions version updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

name: PR Preview Deployment

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "pr-preview-${{ github.event.number }}"
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # Skip preview deployment for automated Dependabot bumps to keep gh-pages clean
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout PR branch
        if: github.event.action != 'closed'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      - name: Build preview site (including draft posts)
        if: github.event.action != 'closed'
        env:
          BASE_PATH: /pr-preview/pr-${{ github.event.number }}
          INCLUDE_DRAFTS: "true"
        run: npm run build

      - name: Deploy PR preview and comment link on PR
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
